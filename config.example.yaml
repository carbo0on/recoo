# =====================================================================
# recoo user config  —  copy to config.yaml and pass with -c config.yaml
# =====================================================================
# Anything here overrides the packaged defaults in recoo/tools.yaml.
# This is the easiest way to keep a permanent, per-target tool selection.

settings:
  threads: 50
  timeout: 1800                       # per-tool timeout in seconds

  # --- Wordlists: OneListForAll (six2dez) ----------------------------
  # Fetch with:  ./download-wordlists.sh short   (or micro | full)
  # The {wordlist_*} placeholders resolve from wordlists_dir + the tier.
  resolvers: wordlists/resolvers.txt
  wordlists_dir: wordlists/OneListForAll
  wordlist_size: short                # micro | short | full
  # Optional: pin a different file per size for any role.
  # wordlist_sizes:
  #   content: {micro: onelistforallmicro.txt, short: onelistforallshort.txt, full: onelistforall_big.txt}
  #   dns:     {micro: dict/dns_short.txt, short: dict/subdomains_short.txt, full: dict/subdomains_long.txt}
  #   params:  {short: dict/parameters_short.txt, full: dict/parameters_long.txt}
  #   perms:   {short: dict/permutations_short.txt, full: dict/permutations_long.txt}
  # Explicit per-role overrides (win over the tiers; leave empty to use them).
  wordlist_dns: ""
  wordlist_content: ""
  wordlist_params: ""
  wordlist_perms: ""

  # API tokens used by certain tools (leave blank to skip those).
  github_token: ""

  # gf patterns run during triage.
  gf_patterns: [ssrf, redirect, idor, xss, lfi, sqli, rce, ssti]

  notify: false                       # pipe new findings to `notify`

# ---------------------------------------------------------------------
# Per-tool overrides. Two forms are accepted:
#
#   toolname: false            # shorthand: just turn it off
#   toolname:                  # or override any field(s)
#     enabled: true
#     timeout: 600
#     cmd: "..."               # even swap the command if you like
# ---------------------------------------------------------------------
tools:
  # turn the heavier / key-dependent tools on for a deep run:
  amass_passive: false
  puredns_brute: false
  permutations: false
  naabu: false
  graphw00f: false
  cloud_enum: false

  # example: keep nuclei but give it a longer leash
  nuclei:
    enabled: true
    timeout: 3600
